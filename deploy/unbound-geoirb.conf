# Installed to /etc/unbound/unbound.conf.d/geoirb.conf by deploy/install.sh.
# DNS for VPN clients (CLIENT_DNS=10.8.0.1): answers from the RU IP, so RU
# sites get RU CDN addresses, and it keeps working while the exit tunnel is
# down. Upstream is DNS over TLS to Cloudflare, straight from this host.
server:
	interface: 10.8.0.1
	# awg0 may come up after unbound
	ip-freebind: yes
	access-control: 0.0.0.0/0 refuse
	access-control: ::/0 refuse
	access-control: 10.8.0.0/22 allow
	tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

forward-zone:
	name: "."
	forward-tls-upstream: yes
	forward-addr: 1.1.1.1@853#cloudflare-dns.com
	forward-addr: 1.0.0.1@853#cloudflare-dns.com
