# Installed to /etc/systemd/networkd.conf.d/geoirb.conf by deploy/install.sh.
# By default systemd-networkd removes every ip rule and route it did not
# create whenever it (re)configures a link it manages: `netplan apply`,
# `networkctl reconfigure`, or a package upgrade that re-triggers eth0 (a
# plain restart or `networkctl reload` does not). That took away the
# split-routing rule (fwmark 0x1 -> table 100), its `unreachable` route and
# the bot's own rules, so client traffic left from the RU address.
# Checked on systemd 255: with these two lines a reconfigure keeps them.
[Network]
ManageForeignRoutingPolicyRules=no
ManageForeignRoutes=no
